[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuck"
version = "0.1.0"
description = "Type `fuck` after a failed command and let Claude fix it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.9"]

[project.scripts]
fuck = "fuck.cli:main"

[tool.setuptools]
packages = ["fuck"]
